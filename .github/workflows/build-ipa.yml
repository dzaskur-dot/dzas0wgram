name: Build Dzas0wgramm .ipa

on:
  workflow_dispatch:   # запуск вручную кнопкой "Run workflow" на вкладке Actions
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Dzas0wgramm.xcodeproj

      - name: Build unsigned .app for iOS device
        run: |
          xcodebuild \
            -project Dzas0wgramm.xcodeproj \
            -scheme Dzas0wgramm \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath build \
            clean build

      - name: Package into .ipa
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/Dzas0wgramm.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Dzas0wgramm.ipa Payload
          ls -la Dzas0wgramm.ipa

      - name: Upload .ipa as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dzas0wgramm-ipa
          path: Dzas0wgramm.ipa
          retention-days: 14
